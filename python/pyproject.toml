[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "itrialspace-eval"
version = "0.1.0"
description = "Reproducible statistics for virtual-lesion trials of lung-CT detection models (companion to the iTRIALSPACE demo app)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "iTRIALSPACE demo contributors" }]
keywords = ["virtual imaging trial", "FROC", "bootstrap", "lung CT", "medical imaging"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.8", "pandas-stubs>=2.0"]

[project.scripts]
itrialspace-eval = "itrialspace_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/itrialspace_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E501"]  # line length is enforced by `ruff format`

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
